<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="ZK-SONG">
  <defs>
    <!-- Polished gold, lit from the top-left: bright crest, deep base. -->
    <linearGradient id="zkGold" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cf" />
      <stop offset="28%" stop-color="#ecc257" />
      <stop offset="62%" stop-color="#c1912b" />
      <stop offset="100%" stop-color="#8f6518" />
    </linearGradient>
    <!-- Inner bevel so the plate reads as a physical object, not a flat shape. -->
    <linearGradient id="zkPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1d" />
      <stop offset="55%" stop-color="#0b0b0d" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>
    <radialGradient id="zkHalo" cx="50%" cy="18%" r="72%">
      <stop offset="0%" stop-color="#ecc257" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ecc257" stop-opacity="0" />
    </radialGradient>
    <filter id="zkLift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Body -->
  <rect width="200" height="200" rx="44" fill="url(#zkPlate)" />
  <rect width="200" height="200" rx="44" fill="url(#zkHalo)" />
  <rect x="5.5" y="5.5" width="189" height="189" rx="39" fill="none"
        stroke="url(#zkGold)" stroke-width="3" />
  <rect x="11" y="11" width="178" height="178" rx="34" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

  <!-- Equalizer: sound bars in solid gold, subtle engraving shadow -->
  <g filter="url(#zkLift)" fill="url(#zkGold)">
    <rect x="44"  y="88" width="13" height="36" rx="6.5" />
    <rect x="68"  y="66" width="13" height="80" rx="6.5" />
    <rect x="92"  y="46" width="13" height="120" rx="6.5" />
    <rect x="116" y="60" width="13" height="92" rx="6.5" />
    <rect x="140" y="80" width="13" height="52" rx="6.5" />
  </g>

  <!-- Top-edge specular highlight -->
  <path d="M40 14 H160" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"
        stroke-linecap="round" />
</svg>
