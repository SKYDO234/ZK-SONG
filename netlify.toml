# ============================================================================
# ZK-SONG — Netlify deployment (frontend + API functions in one site)
#
# The React app is served statically by Netlify's CDN; /api/* is handled by the
# function in netlify/functions/api.mjs, which runs the exact same code as the
# Express backend. /uploads/* is routed there too so stored media keeps working.
#
# Required environment variables (Site configuration → Environment variables):
#   DATABASE_URL                Postgres connection string (Supabase/Neon)
#   SUPABASE_URL                https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   service_role key (Storage uploads/deletes)
#   JWT_SECRET                  long random string
#   ADMIN_EMAIL / ADMIN_PASSWORD
#
# Nothing else to configure: SQLite and local disk are simply not used here.
# ============================================================================

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Audio never passes through the function (browser → Supabase Storage), so the
  # payload is metadata only. Keep the buffer modest.
  included_files = []

# API + stored media go to the function, before the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA fallback — client-side routes (/admin/songs/:id etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
